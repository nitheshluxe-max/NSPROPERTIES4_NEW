<!doctype html>
<html lang="en" data-theme="corporate"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NS Properties 4 — free property listings, search and direct owner contacts."><title>NS Properties 4 | Free Property Marketplace</title><link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head>
<body class="bg-base-200 min-h-screen"><header class="navbar bg-base-100 shadow-sm px-4 md:px-10"><div class="flex-1"><a href="./" class="text-xl font-bold text-primary">NS PROPERTIES 4</a></div><a href="./admin.html" class="btn btn-ghost mr-2">Admin</a><button id="postButton" class="btn btn-primary">Post property — FREE</button></header>
<main class="max-w-7xl mx-auto px-4 py-8"><section class="bg-base-100 rounded-2xl p-6 md:p-10 mb-8"><h1 class="text-3xl md:text-5xl font-bold">Find your next property. For free.</h1><p class="mt-3 text-base-content/70">Search homes, rentals and commercial spaces. Contact owners and agents directly without paywalls.</p><form id="filters" class="grid grid-cols-1 md:grid-cols-4 gap-3 mt-6"><input id="q" class="input input-bordered w-full" placeholder="City, area or keyword"><select id="purpose" class="select select-bordered w-full"><option value="">Buy or rent</option><option value="sale">Buy</option><option value="rent">Rent</option><option value="lease">Lease</option></select><select id="type" class="select select-bordered w-full"><option value="">All property types</option><option value="apartment">Apartment</option><option value="house">Independent house</option><option value="plot">Plot</option><option value="commercial">Commercial</option><option value="pg">PG</option></select><button class="btn btn-primary">Search properties</button></form></section><div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-semibold">Properties</h2><span id="status" class="text-sm text-base-content/60" role="status"></span></div><div id="listings" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div></main>
<dialog id="postDialog" class="modal"><div class="modal-box max-w-2xl"><form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Close">✕</button></form><h3 class="font-bold text-xl mb-4">Post your property — FREE</h3><p class="text-sm mb-4">Sign in with email to post. Your contact number will be public only if you choose to publish it.</p><form id="propertyForm" class="grid grid-cols-1 sm:grid-cols-2 gap-3"><input name="title" required maxlength="120" class="input input-bordered w-full sm:col-span-2" placeholder="Property title"><input name="city" required class="input input-bordered w-full" placeholder="City"><input name="locality" required class="input input-bordered w-full" placeholder="Locality"><select name="purpose" required class="select select-bordered w-full"><option value="sale">For sale</option><option value="rent">For rent</option><option value="lease">For lease</option></select><select name="property_type" required class="select select-bordered w-full"><option value="apartment">Apartment</option><option value="house">House</option><option value="plot">Plot</option><option value="commercial">Commercial</option><option value="pg">PG</option></select><input name="price" required type="number" min="1" step="1" class="input input-bordered w-full" placeholder="Price in ₹"><input name="area_sqft" type="number" min="1" class="input input-bordered w-full" placeholder="Area (sq ft)"><input name="contact_phone" pattern="[0-9+() -]{7,20}" class="input input-bordered w-full sm:col-span-2" placeholder="Contact number (optional)"><label class="sm:col-span-2 text-sm font-semibold">Property photos (up to 6, JPG/PNG/WebP, 5 MB each)<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple class="file-input file-input-bordered w-full mt-2"></label><textarea name="description" maxlength="3000" class="textarea textarea-bordered sm:col-span-2" placeholder="Description"></textarea><label class="label sm:col-span-2 justify-start gap-2"><input type="checkbox" name="publish_contact" class="checkbox">I consent to publicly display my contact number on this listing</label><button class="btn btn-primary sm:col-span-2" type="submit">Submit property for review</button></form><p id="formStatus" class="text-sm mt-3" role="status"></p></div></dialog>
<script type="module" src="./app.js"></script></body></html>

<!doctype html><html lang="en" data-theme="corporate"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NS Properties 4 | Admin</title><link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head><body class="bg-base-200 min-h-screen"><header class="navbar bg-base-100 shadow-sm px-5"><a href="./" class="font-bold text-primary flex-1">NS PROPERTIES 4 · Admin</a><button id="logout" class="btn btn-outline btn-sm">Sign out</button></header><main class="max-w-6xl mx-auto p-5"><section id="login" class="card bg-base-100 p-6 max-w-lg"><h1 class="text-2xl font-bold mb-3">Admin sign in</h1><p class="mb-3">Only accounts registered in the admin_users table can approve listings.</p><form id="loginForm" class="flex flex-col gap-3"><input id="email" type="email" required placeholder="Admin email" class="input input-bordered w-full"><button class="btn btn-primary">Email me a sign-in link</button></form></section><p id="message" class="my-4" role="status"></p><section id="dashboard" hidden><div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Property moderation</h2><button id="refresh" class="btn btn-outline">Refresh</button></div><div class="overflow-x-auto bg-base-100 rounded-xl"><table class="table"><thead><tr><th>Property</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module" src="./admin.js"></script></body></html>

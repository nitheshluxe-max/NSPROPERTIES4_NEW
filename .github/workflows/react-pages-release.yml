name: React Pages build and deployment
on:
  push:
    branches:
      - main
    paths:
      - 'react-app/**'
      - '.github/workflows/react-pages-release.yml'
  pull_request:
    paths:
      - 'react-app/**'
      - '.github/workflows/react-pages-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Install dependencies
        working-directory: react-app
        run: npm install --no-audit --no-fund
      - name: Type check
        working-directory: react-app
        run: npm run lint
      - name: Build React for GitHub Pages
        working-directory: react-app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIRESTORE_DATABASE_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build
      - name: SPA fallback for GitHub Pages
        run: cp react-app/dist/index.html react-app/dist/404.html
      - name: Verify compiled app
        run: |
          test -s react-app/dist/index.html
          test -s react-app/dist/assets/logo.svg
      - name: Upload React build preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-pages-preview
          path: react-app/dist/
          retention-days: 7
      - name: Upload Pages release artifact
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist/
  deploy:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

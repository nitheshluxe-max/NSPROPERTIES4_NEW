<!DOCTYPE html><html lang="en" data-theme="corporate"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NS Properties 4 | Supabase Admin</title><link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><header class="bg-white border-b p-5"><div class="container flex justify-between"><a href="../index.html" class="font-bold brand">NS PROPERTIES 4</a><span>Administration</span></div></header>
<main class="container py-8"><section id="loginBox" class="content-card max-w-md mx-auto"><h1 class="section-title">Admin Login</h1><form id="loginForm" class="space-y-4"><label for="username">Email</label><input class="form-control" id="username" type="email" autocomplete="username" required><label for="password">Password</label><input class="form-control" type="password" id="password" autocomplete="current-password" required><button class="btn btn-brand w-full">Sign in</button></form></section>
<section id="dashboard" hidden><div class="flex justify-between mb-6"><h1 class="section-title">Admin Dashboard</h1><button id="logout" class="btn btn-outline">Log out</button></div><div id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6"></div><div class="content-card overflow-x-auto"><h2 class="section-title">Property Approvals</h2><div id="propertiesTable"></div></div><div class="content-card overflow-x-auto mt-6"><h2 class="section-title">Recent Enquiries</h2><div id="enquiriesTable"></div></div></section><p id="notice" role="status" aria-live="polite" class="mt-4"></p></main>
<script src="../assets/js/supabase-config.js"></script><script src="../assets/js/backend.js"></script><script src="supabase-admin.js"></script></body></html>
